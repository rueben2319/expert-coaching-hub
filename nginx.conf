events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Treat localhost-style hosts as local environments.
    map $host $is_local_env {
        default 0;
        localhost 1;
        127.0.0.1 1;
        ::1 1;
    }

    # Use NGINX request ID as a per-request CSP nonce.
    map $request_id $csp_nonce {
        default $request_id;
    }

    # CSP reporting endpoint is enabled only in non-local environments.
    map $is_local_env $csp_report_directives {
        1 "";
        0 "; report-uri /csp-report; report-to csp-endpoint";
    }

    map $is_local_env $report_to_header {
        1 "";
        0 '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"/csp-report"}]}';
    }

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Handle React Router - fallback to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # CSP violation telemetry endpoint (active via CSP headers in non-local envs).
        location = /csp-report {
            if ($is_local_env) {
                return 404;
            }

            access_log /var/log/nginx/csp-violations.log;
            return 204;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Report-To $report_to_header always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'nonce-$csp_nonce'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.paychangu.com; form-action 'self';$csp_report_directives" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
